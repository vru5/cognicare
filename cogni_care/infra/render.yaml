services:
  - type: web
    name: cogni-care-backend
    env: node
    plan: free
    rootDir: cogni_care/server
    buildCommand: npm install && npx prisma generate --schema=../prisma/schema.prisma
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
